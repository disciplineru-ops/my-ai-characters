<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мои ИИ-персонажи</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f7;
            color: #222;
        }

        header {
            background: #ffffff;
            padding: 18px;
            font-size: 22px;
            font-weight: bold;
            border-bottom: 1px solid #ddd;
        }

        main {
            max-width: 700px;
            margin: auto;
            padding: 25px 18px;
        }

        h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }

        p {
            color: #666;
        }

        .buttons {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 25px;
        }

        button {
            border: none;
            border-radius: 12px;
            padding: 14px 20px;
            font-size: 16px;
            cursor: pointer;
        }

        .primary {
            background: #222;
            color: white;
        }

        .secondary {
            background: white;
            border: 1px solid #ddd;
        }

        .card {
            background: white;
            border-radius: 16px;
            padding: 20px;
            margin-top: 25px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.06);
        }
    </style>
</head>

<body>

<header>
    🤖 Мои ИИ-персонажи
</header>

<main>

    <h1>Добро пожаловать</h1>

    <p>
        Твои персонажи, сценарии и чаты находятся здесь.
    </p>

    <div class="buttons">
        <button class="primary">＋ Создать персонажа</button>
        <button class="secondary">📖 Создать сценарий</button>
    </div>

    <div class="card">
        <h2>👤 Мои персонажи</h2>
        <p>Здесь будут отображаться созданные тобой персонажи.</p>
    </div>

    <div class="card">
        <h2>📚 Мои сценарии</h2>
        <p>Здесь будут отображаться созданные тобой сценарии.</p>
    </div>

</main>

</body>
  </html>
