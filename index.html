<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Мои ИИ-персонажи</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f5f7;
  color:#222
}

header{
  background:white;
  padding:20px;
  border-bottom:1px solid #ddd;
  font-size:22px;
  font-weight:bold
}

.container{
  max-width:900px;
  margin:auto;
  padding:25px 18px
}

h1{font-size:36px;margin-bottom:8px}
h2{margin-top:0}

.subtitle{
  color:#666;
  font-size:18px;
  margin-bottom:25px
}

.buttons{
  display:flex;
  gap:10px;
  flex-wrap:wrap
}

button{
  border:0;
  border-radius:12px;
  padding:14px 18px;
  font-size:16px;
  cursor:pointer
}

.primary{
  background:#222;
  color:white
}

.secondary{
  background:white;
  border:1px solid #ddd
}

.card,.form{
  background:white;
  border-radius:18px;
  padding:22px;
  margin-top:22px;
  box-shadow:0 4px 18px rgba(0,0,0,.06)
}

.form{display:none}
.form.active{display:block}

label{
  display:block;
  font-weight:bold;
  margin:16px 0 7px
}

input,textarea,select{
  width:100%;
  padding:13px;
  border:1px solid #ccc;
  border-radius:10px;
  font-size:16px;
  font-family:Arial,sans-serif
}

textarea{
  min-height:120px;
  resize:vertical
}

.form-buttons{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-top:20px
}

.item{
  border:1px solid #eee;
  border-radius:14px;
  padding:16px;
  margin-top:12px
}

.item h3{
  margin:0 0 8px
}

.small{
  color:#666;
  white-space:pre-wrap;
  line-height:1.5
}

.delete{
  margin-top:12px;
  background:#eee;
  padding:9px 13px;
  font-size:14px
}

.chat-messages{
  background:#f5f5f7;
  border-radius:14px;
  padding:15px;
  min-height:280px;
  max-height:500px;
  overflow-y:auto;
  margin-bottom:15px
}

.message{
  padding:11px 14px;
  border-radius:12px;
  margin:8px 0;
  max-width:90%;
  white-space:pre-wrap
}

.user-message{
  background:#222;
  color:white;
  margin-left:auto
}

.character-message{
  background:white;
  border:1px solid #ddd
}

.empty{
  color:#777
}
</style>
</head>

<body>

<header>🤖 Мои ИИ-персонажи</header>

<div class="container">

<h1>Добро пожаловать</h1>

<div class="subtitle">
Твои персонажи, сценарии и чаты находятся здесь.
</div>

<div class="buttons">

<button class="primary" onclick="showCharacterForm()">
＋ Создать персонажа
</button>

<button class="secondary" onclick="showScenarioForm()">
📖 Создать сценарий
</button>

<button class="primary" onclick="openChatSetup()">
💬 Новый чат
</button>

</div>


<!-- СОЗДАНИЕ ПЕРСОНАЖА -->

<div id="characterForm" class="form">

<h2>👤 Создать персонажа</h2>

<label>Имя персонажа</label>
<input id="characterName" placeholder="Например: Анна">

<label>Пол</label>

<select id="characterGender">
<option>Не указан</option>
<option>Мужской</option>
<option>Женский</option>
<option>Другой</option>
</select>

<label>Краткое описание</label>

<textarea id="characterDescription"
placeholder="Кто этот персонаж?"></textarea>

<label>Характер</label>

<textarea id="characterPersonality"
placeholder="Опиши характер, привычки, манеру общения..."></textarea>

<label>Дополнительные инструкции</label>

<textarea id="characterInstructions"
placeholder="Как персонаж должен вести себя в диалоге?"></textarea>

<label>Первое сообщение</label>

<textarea id="characterGreeting"
placeholder="Что персонаж скажет первым?"></textarea>

<div class="form-buttons">

<button class="primary" onclick="saveCharacter()">
Сохранить персонажа
</button>

<button class="secondary" onclick="closeAllForms()">
Отмена
</button>

</div>

</div>


<!-- СОЗДАНИЕ СЦЕНАРИЯ -->

<div id="scenarioForm" class="form">

<h2>📖 Создать сценарий</h2>

<label>Название сценария</label>

<input id="scenarioName"
placeholder="Например: Империя Юань">

<label>Сценарий</label>

<textarea id="scenarioText"
style="min-height:300px"
placeholder="Свободно опиши весь сценарий, мир, события, обстоятельства и правила..."></textarea>

<div class="form-buttons">

<button class="primary" onclick="saveScenario()">
Сохранить сценарий
</button>

<button class="secondary" onclick="closeAllForms()">
Отмена
</button>

</div>

</div>


<!-- ВЫБОР ПЕРСОНАЖА И СЦЕНАРИЯ -->

<div id="chatSetup" class="form">

<h2>💬 Новый чат</h2>

<label>Персонаж</label>

<select id="chatCharacter"></select>

<label>Сценарий</label>

<select id="chatScenario"></select>

<div class="form-buttons">

<button class="primary" onclick="startChat()">
Начать чат
</button>

<button class="secondary" onclick="closeAllForms()">
Отмена
</button>

</div>

</div>


<!-- ОКНО ЧАТА -->

<div id="chatWindow" class="form">

<h2 id="chatTitle">💬 Чат</h2>

<div id="chatInfo" class="small"></div>

<div id="chatMessages" class="chat-messages"></div>

<textarea id="messageInput"
placeholder="Напиши сообщение..."
style="min-height:80px"></textarea>

<div class="form-buttons">

<button class="primary" onclick="sendMessage()">
Отправить
</button>

<button class="secondary" onclick="closeChat()">
Закрыть чат
</button>

</div>

</div>


<!-- ПЕРСОНАЖИ -->

<div class="card">

<h2>👤 Мои персонажи</h2>

<div id="characters"></div>

</div>


<!-- СЦЕНАРИИ -->

<div class="card">

<h2>📚 Мои сценарии</h2>

<div id="scenarios"></div>

</div>

</div>


<script>

function getCharacters(){
return JSON.parse(localStorage.getItem("characters") || "[]");
}

function getScenarios(){
return JSON.parse(localStorage.getItem("scenarios") || "[]");
}


function closeAllForms(){

document.querySelectorAll(".form").forEach(function(form){
form.classList.remove("active");
});

}


function showCharacterForm(){

closeAllForms();

document.getElementById("characterForm")
.classList.add("active");

}


function showScenarioForm(){

closeAllForms();

document.getElementById("scenarioForm")
.classList.add("active");

}


function saveCharacter(){

const name=document.getElementById("characterName").value.trim();

if(!name){
alert("Введите имя персонажа.");
return;
}

const character={

id:Date.now(),

name:name,

gender:document.getElementById("characterGender").value,

description:
document.getElementById("characterDescription").value,

personality:
document.getElementById("characterPersonality").value,

instructions:
document.getElementById("characterInstructions").value,

greeting:
document.getElementById("characterGreeting").value

};

const characters=getCharacters();

characters.push(character);

localStorage.setItem(
"characters",
JSON.stringify(characters)
);

document.getElementById("characterName").value="";
document.getElementById("characterDescription").value="";
document.getElementById("characterPersonality").value="";
document.getElementById("characterInstructions").value="";
document.getElementById("characterGreeting").value="";

closeAllForms();

displayCharacters();

alert("Персонаж создан!");

}


function saveScenario(){

const name=document.getElementById("scenarioName").value.trim();

if(!name){
alert("Введите название сценария.");
return;
}

const scenario={

id:Date.now(),

name:name,

text:
document.getElementById("scenarioText").value

};

const scenarios=getScenarios();

scenarios.push(scenario);

localStorage.setItem(
"scenarios",
JSON.stringify(scenarios)
);

document.getElementById("scenarioName").value="";
document.getElementById("scenarioText").value="";

closeAllForms();

displayScenarios();

alert("Сценарий создан!");

}


function deleteCharacter(index){

const characters=getCharacters();

if(!confirm("Удалить этого персонажа?")) return;

characters.splice(index,1);

localStorage.setItem(
"characters",
JSON.stringify(characters)
);

displayCharacters();

}


function deleteScenario(index){

const scenarios=getScenarios();

if(!confirm("Удалить этот сценарий?")) return;

scenarios.splice(index,1);

localStorage.setItem(
"scenarios",
JSON.stringify(scenarios)
);

displayScenarios();

}


function displayCharacters(){

const box=document.getElementById("characters");

const characters=getCharacters();

if(characters.length===0){

box.innerHTML=
'<div class="empty">Пока нет персонажей.</div>';

return;

}

box.innerHTML="";

characters.forEach(function(character,index){

box.innerHTML+=`

<div class="item">

<h3>🤖 ${escapeHtml(character.name)}</h3>

<div class="small">
Пол: ${escapeHtml(character.gender)}
</div>

<p>
${escapeHtml(character.description)}
</p>

<button class="delete"
onclick="deleteCharacter(${index})">
Удалить
</button>

</div>

`;

});

}


function displayScenarios(){

const box=document.getElementById("scenarios");

const scenarios=getScenarios();

if(scenarios.length===0){

box.innerHTML=
'<div class="empty">Пока нет сценариев.</div>';

return;

}

box.innerHTML="";

scenarios.forEach(function(scenario,index){

box.innerHTML+=`

<div class="item">

<h3>📖 ${escapeHtml(scenario.name)}</h3>

<div class="small">
${escapeHtml(scenario.text)}
</div>

<button class="delete"
onclick="deleteScenario(${index})">
Удалить
</button>

</div>

`;

});

}


function openChatSetup(){

const characters=getCharacters();

const scenarios=getScenarios();

if(characters.length===0){

alert("Сначала создай хотя бы одного персонажа.");

return;

}

if(scenarios.length===0){

alert("Сначала создай хотя бы один сценарий.");

return;

}

const characterSelect=
document.getElementById("chatCharacter");

const scenarioSelect=
document.getElementById("chatScenario");

characterSelect.innerHTML="";
scenarioSelect.innerHTML="";

characters.forEach(function(character,index){

characterSelect.innerHTML+=`

<option value="${index}">
${escapeHtml(character.name)}
</option>

`;

});

scenarios.forEach(function(scenario,index){

scenarioSelect.innerHTML+=`

<option value="${index}">
${escapeHtml(scenario.name)}
</option>

`;

});

closeAllForms();

document.getElementById("chatSetup")
.classList.add("active");

}


function startChat(){

const characters=getCharacters();

const scenarios=getScenarios();

const character=
characters[
document.getElementById("chatCharacter").value
];

const scenario=
scenarios[
document.getElementById("chatScenario").value
];

localStorage.setItem(
"activeCharacter",
JSON.stringify(character)
);

localStorage.setItem(
"activeScenario",
JSON.stringify(scenario)
);

const chatKey=
"chat_"+character.id+"_"+scenario.id;

let messages=
JSON.parse(localStorage.getItem(chatKey) || "[]");

document.getElementById("chatTitle").textContent=
"💬 "+character.name;

document.getElementById("chatInfo").innerHTML=
"<b>Сценарий:</b> "+
escapeHtml(scenario.name);

renderMessages(messages,character);

closeAllForms();

document.getElementById("chatWindow")
.classList.add("active");

}


function sendMessage(){

const input=
document.getElementById("messageInput");

const text=input.value.trim();

if(!text)return;

const character=
JSON.parse(
localStorage.getItem("activeCharacter")
);

const scenario=
JSON.parse(
localStorage.getItem("activeScenario")
);

const chatKey=
"chat_"+character.id+"_"+scenario.id;

let messages=
JSON.parse(localStorage.getItem(chatKey) || "[]");

messages.push({

sender:"user",

text:text

});

localStorage.setItem(
chatKey,
JSON.stringify(messages)
);

input.value="";

renderMessages(messages,character);

}


function renderMessages(messages,character){

const box=
document.getElementById("chatMessages");

box.innerHTML="";

if(messages.length===0){

box.innerHTML=`

<div class="message character-message">

${escapeHtml(
character.greeting ||
"Привет! Рад с тобой познакомиться."
)}

</div>

`;

return;

}

messages.forEach(function(message){

if(message.sender==="user"){

box.innerHTML+=`

<div class="message user-message">

<b>Ты:</b><br>

${escapeHtml(message.text)}

</div>

`;

}else{

box.innerHTML+=`

<div class="message character-message">

<b>${escapeHtml(character.name)}:</b><br>

${escapeHtml(message.text)}

</div>

`;

}

});

box.scrollTop=box.scrollHeight;

}


function closeChat(){

document.getElementById("chatWindow")
.classList.remove("active");

}


function escapeHtml(text){

return String(text || "")

.replace(/&/g,"&amp;")

.replace(/</g,"&lt;")

.replace(/>/g,"&gt;")

.replace(/"/g,"&quot;")

.replace(/'/g,"&#039;");

}


displayCharacters();

displayScenarios();

</script>

</body>
  </html>
